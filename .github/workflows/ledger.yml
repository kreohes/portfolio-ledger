name: ledger

on:
  push:
    paths:
      - "features/ledger/**"
      - "apps/cli/**"
      - "internal/tooling/**"
      - ".github/workflows/ledger.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
